name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly external-link sweep (Mondays 06:00 UTC). Separate from PR gating so a third-party
    # outage never blocks a docs merge, but genuinely dead external links are still caught.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # PR / push gate: dependency audit + VitePress build (internal dead links fail the build) +
  # a non-blocking external link report.
  build:
    name: Build + internal link check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      # `vitepress build` fails on dead INTERNAL links by default (ignoreDeadLinks unset), so this
      # step is the internal-strict link gate.
      - name: Build (internal-strict dead-link detection)
        run: npm run build

      # External links: robust (cache + retries + accept rate-limit/partial), non-blocking on PRs so
      # transient third-party downtime can't fail an unrelated docs change. The scheduled job below
      # is the blocking external gate. Only checks http/https; skips internal file:// links.
      - name: External link check (report-only)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --max-retries 3
            --retry-wait-time 2
            --accept 200,206,429
            --scheme https
            --scheme http
            docs/**/*.md
          fail: false

  # Scheduled / manual: blocking external-link sweep. Dead external links fail here, out of band.
  external-links:
    name: External link check (blocking, scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: External link check (blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --max-retries 3
            --retry-wait-time 2
            --accept 200,206,429
            --scheme https
            --scheme http
            docs/**/*.md
          fail: true
